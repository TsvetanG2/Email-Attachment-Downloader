name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Fail the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is reported as warnings only
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

      - name: Syntax check (compile all modules)
        run: |
          # This is a Tkinter GUI app, so we can't launch it headless in CI.
          # Instead, compile every module to catch syntax/indentation errors
          # without executing the GUI.
          python -m compileall -q main.py src
          echo "All modules compiled OK"
